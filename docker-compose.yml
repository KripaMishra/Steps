services:
  app:
    build:
      context: .
      args:
        REQUIREMENTS: requirements-demo.txt
    environment:
      RAG_MODE: demo
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    ports:
      - "8501:8501"
    restart: unless-stopped
    networks: [public]

  app-full:
    profiles: [full]
    build:
      context: .
      args:
        REQUIREMENTS: requirements.txt
    environment:
      RAG_MODE: full
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      MILVUS_ENDPOINT: ${MILVUS_ENDPOINT:?MILVUS_ENDPOINT is required}
      MILVUS_TOKEN: ${MILVUS_TOKEN:?MILVUS_TOKEN is required}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-elasticsearch}
      ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-documents}
      ELASTICSEARCH_ENABLED: ${ELASTICSEARCH_ENABLED:-false}
    ports:
      - "8502:8501"
    restart: unless-stopped
    networks: [public, backend]

  elasticsearch:
    profiles: [elasticsearch]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    expose: ["9200"]
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 45s
      retries: 10
    restart: unless-stopped
    networks: [backend]

networks:
  public:
  backend:
    internal: true

volumes:
  elasticsearch-data:
