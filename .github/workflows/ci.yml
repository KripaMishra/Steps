name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight demo and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-demo.txt pytest
      - name: Tests
        run: python -m pytest -q
      - name: AST and lightweight import smoke check
        run: python scripts/check_ast_imports.py
      - name: Offline evaluator thresholds
        run: make evaluate
      - name: Repository hygiene
        run: |
          test -z "$(git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$|.*\.db\.lock$|\.env$|result/)' || true)"
      - name: Diff whitespace check
        run: git diff --check
